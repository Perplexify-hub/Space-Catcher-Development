<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Catcher</title>
  <link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

  <body>

  <h1 class="sci-fi-text">MISSION READY</h1>

  <div class="title-wings">
  <span class="wing left"></span>
  <h1 class="sci-fi-text cyan-glow-heavy">SPACE CATCHER</h1>
  <span class="wing right"></span>
</div>


<p class="calligraphy-casual cyan-glow">Space Catcher is an exciting cosmic adventure.</p>



 <div class="hud">
  <div class="hud-item">
    <p class="calligraphy-casual cyan-glow">SCORE</p>
    <p class="score-value">0</p>
  </div>

  <div class="hud-item">
    <p class=" calligraphy-casual cyan-glow">LIVES</p>
    <p class="lives">♥ ♥ ♥</p>
  </div>
</div>

<div class="game-area">
 <div class="star">★</div>

  <div class="spaceship">
  <img src="spaceship.png" alt="Futuristic spaceship">
</div>
</div>

<button class="start-btn">Start game</button>
